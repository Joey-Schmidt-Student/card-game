<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thicket Duel</title>
<style>
:root{--table:#16232e;--panel:#213546;--ink:#14202a;--light:#e7edf2;--gold:#e3b341;--ember:#f0a37a;--tide:#8cc6e8;--leaf:#a6d28b}
*{box-sizing:border-box}
body{margin:0;background:var(--table);color:var(--light);font:15px/1.4 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px;border-bottom:1px solid #2c4358}
h1{margin:0;font:700 24px Georgia,serif}
#status{color:var(--gold);font-weight:600}
main{max-width:1160px;margin:0 auto;padding:12px;display:grid;gap:10px}
#board{display:grid;gap:12px}
.manager{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;align-items:start}
.decknav,.deckeditor,.pool{background:var(--panel);border-radius:10px;padding:12px;display:grid;gap:8px}
.decknav{align-content:start}
.decknav button,.deckitem{width:100%;text-align:left}
.deckitem.active{outline:2px solid var(--gold)}
.deckeditor{grid-template-columns:minmax(0,1fr) minmax(220px,.8fr)}
.deckcards,.poolcards{display:grid;gap:6px;align-content:start;max-height:65vh;overflow:auto}
.deckentry,.poolentry{background:#162b3b;border-radius:7px;padding:7px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.deckentry small,.poolentry small{display:block;color:#9fb4c4}
.poolentry{flex-wrap:wrap}
.poolentry button{margin-left:auto}
.decktitle{display:flex;justify-content:space-between;align-items:center;gap:8px}
.deckactions{display:flex;gap:8px;flex-wrap:wrap}
.deckhint{color:var(--gold);min-height:20px}
.select{background:var(--light);color:var(--ink);border:0;border-radius:6px;padding:7px}
.side{display:grid;gap:8px}
.info{color:#9fb4c4;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.slot{width:116px;min-height:176px;border:2px dashed #35516a;border-radius:10px;display:grid;place-items:center;color:#5d7b93;font-size:13px}
.card{width:116px;min-height:176px;padding:8px;border:2px solid var(--ink);border-radius:10px;color:var(--ink);text-align:left;font:inherit;font-size:12px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.card b{font:700 14px Georgia,serif;text-transform:capitalize}
.card small{font-size:11px}
.card.ember{background:var(--ember)}.card.tide{background:var(--tide)}.card.leaf{background:var(--leaf)}
.card[tabindex="-1"]{cursor:default}
.card.sel{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:block;height:6px;background:#0003;border-radius:3px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--ink)}
.pips{display:flex;gap:3px;min-height:12px}
.pip{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}
.pip.big{width:36px;height:36px;margin:auto}
.pip.ember{background:#d9461b}.pip.tide{background:#1c7cc0}.pip.leaf{background:#3f8f2b}
.art{display:block;width:100%;border-radius:6px;margin-bottom:2px}
.card.trainer{background:#d6cfe6}
.prizes{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.prize{display:inline-block;width:12px;height:17px;border-radius:2px;border:1.5px solid #5d7b93}
.prize.got{background:var(--gold);border-color:var(--gold)}
.mid{background:var(--panel);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.log{margin:0;padding:0;list-style:none;font-size:13px;color:#b9cad6;min-height:70px}
.hint{color:var(--gold);min-height:20px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--light);color:var(--ink);border:0;border-radius:8px;padding:8px 12px;font:600 14px system-ui;cursor:pointer}
.btn .pip{margin:0 1px;vertical-align:-1px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.go{background:var(--gold)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media(max-width:700px){.manager,.deckeditor{grid-template-columns:1fr}.deckcards,.poolcards{max-height:40vh}}
@media(max-width:520px){.card,.slot{width:100px}}
</style>
</head>
<body>
<header><h1>Thicket Duel</h1><div style="display:flex;align-items:center;gap:12px"><button id="deck-menu" class="btn" hidden>Decks</button><div id="status" role="status"></div></div></header>
<main id="board"></main>
<script>
// Thicket Duel: a small original card battler. Take 6 prizes to win.
const BEATS={ember:'leaf',leaf:'tide',tide:'ember'}; // attacker type -> defender type it hits for double
const TYPES=['ember','tide','leaf'];
const ROSTER=[
 ['Cindersnout','ember',60,[['Spark',1,10],['Blaze',2,30]]],
 ['Ashfang','ember',90,[['Scorch',2,30],['Inferno',3,70]],1,'Cindersnout'],
 ['Wickling','ember',50,[['Flicker',1,20]]],
 ['Brookpup','tide',60,[['Splash',1,10],['Current',2,30]]],
 ['Tidehorn','tide',90,[['Ram',2,30],['Tsunami',3,70]],1,'Brookpup'],
 ['Pebblefin','tide',50,[['Nip',1,20]]],
 ['Mossling','leaf',60,[['Tickle',1,10],['Vine Whip',2,30]]],
 ['Briarstag','leaf',90,[['Gore',2,30],['Overgrowth',3,70]],1,'Mossling'],
 ['Sproutkit','leaf',50,[['Nibble',1,20]]],
 ['Cindersnout-GX','ember',180,[['Spark',1,30],['Wildfire',3,100,'gx']],0,null,'GX'],
 ['Brookpup-ex','tide',180,[['Splash',1,30],['Tidal Crush',3,100]],0,null,'ex'],
 ['Cindersnout-EX','ember',170,[['Spark',1,30],['Scorching Rush',3,90]],0,null,'EX'],
 ['Ashfang-Mega-EX','ember',240,[['Blazing Impact',4,160]],1,'Cindersnout-EX','MEGA EX'],
 ['Mossling-V','leaf',210,[['Leaf Blade',2,60],['Verdant V',3,120]],0,null,'V'],
 ['Briarstag-VMAX','leaf',320,[['G-Max Overgrowth',3,150]],1,'Mossling-V','VMAX'],
 ['Cinderpup','ember',50,[['Coal Toss',1,10]]],
 ['Scorchmaw','ember',110,[['Hot Bite',2,40],['Magma Rush',3,80]],1,'Cinderpup'],
 ['Driplet','tide',50,[['Bubble Pop',1,10]]],
 ['Frostshell','tide',110,[['Ice Pebble',1,20],['Glacier Crash',3,80]],1,'Driplet'],
 ['Budhorn','leaf',60,[['Seed Flick',1,10]]],
 ['Canopyrex','leaf',120,[['Root Snare',2,40],['Forest Slam',3,90]],1,'Budhorn'],
 ['Scorchmaw-V','ember',220,[['Flame Fang',2,60],['Volcanic V',3,130]],0,null,'V'],
 ['Frostshell-ex','tide',210,[['Chill Touch',2,50],['Avalanche',3,120]],0,null,'ex'],
 ['Canopyrex-VMAX','leaf',340,[['Gigantamax Grove',3,160]],2,'Canopyrex','VMAX']];
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const ABILITIES={
 ember:{name:'Kindle',text:'Once during your turn, draw 1 card.',fx:'draw'},
 tide:{name:'Restoring Current',text:'Once during your turn, heal 20 HP from one of your creatures.',fx:'heal'},
 leaf:{name:'Leaf Guard',text:'Once during your turn, reduce the next damage this creature takes by 20.',fx:'guard'}
};
const mkC=r=>({k:'c',name:r[0],type:r[1],max:r[2],hp:r[2],atks:r[3],en:[],stage:r[4]||0,evolvesFrom:r[5]||null,rule:r[6]||'',prizes:r[6]==='VMAX'?3:r[6]?2:1,ability:r[4]?ABILITIES[r[1]]:null,shield:0,playedTurn:0,abilityTurn:0});
const PRIZES=6;
const TR=[['Potion','Heal 30 HP on one creature.','potion'],['Fresh Draw','Draw 2 cards.','draw'],['Free Switch','Swap your active with a bench creature.','swap'],['Sharpen','Your attacks deal +20 this turn.','boost']];
const mkT=i=>{const t=TR[i%4];return{k:'t',type:'trainer',name:t[0],text:t[1],fx:t[2]}};
const DECK_LIMIT=60,DECK_STORAGE='thicket-duel-decks',ACTIVE_DECK_STORAGE='thicket-duel-active';
const creatureKey=name=>`c:${name}`,energyKey=type=>`e:${type}`,trainerKey=name=>`t:${name}`;
const CARD_KEYS=[
  ...ROSTER.map(r=>creatureKey(r[0])),
  ...TYPES.map(energyKey),
  ...TR.map(t=>trainerKey(t[0]))
];
const copies=(key,count)=>Array(count).fill(key);
const starterDecks=[
  {id:'ember',name:'Ember Team',cards:[
    ...copies(creatureKey('Cindersnout'),4),...copies(creatureKey('Ashfang'),2),
    ...copies(creatureKey('Cinderpup'),2),...copies(creatureKey('Scorchmaw'),2),
    ...copies(creatureKey('Scorchmaw-V'),2),...copies(energyKey('ember'),8),
    ...copies(trainerKey('Potion'),3),...copies(trainerKey('Fresh Draw'),3),
    ...copies(trainerKey('Free Switch'),2),...copies(trainerKey('Sharpen'),2)]},
  {id:'tide',name:'Tide Team',cards:[
    ...copies(creatureKey('Brookpup'),4),...copies(creatureKey('Tidehorn'),2),
    ...copies(creatureKey('Driplet'),2),...copies(creatureKey('Frostshell'),2),
    ...copies(creatureKey('Frostshell-ex'),2),...copies(energyKey('tide'),8),
    ...copies(trainerKey('Potion'),3),...copies(trainerKey('Fresh Draw'),3),
    ...copies(trainerKey('Free Switch'),2),...copies(trainerKey('Sharpen'),2)]},
  {id:'leaf',name:'Leaf Team',cards:[
    ...copies(creatureKey('Mossling'),4),...copies(creatureKey('Briarstag'),2),
    ...copies(creatureKey('Budhorn'),2),...copies(creatureKey('Canopyrex'),2),
    ...copies(creatureKey('Mossling-V'),2),...copies(energyKey('leaf'),8),
    ...copies(trainerKey('Potion'),3),...copies(trainerKey('Fresh Draw'),3),
    ...copies(trainerKey('Free Switch'),2),...copies(trainerKey('Sharpen'),2)]}
];
let DECKS=[],selectedDeckId='ember',deckFilter='all',deckNotice='',poolScrollTop=0;
function useStarterDecks(){
  DECKS=starterDecks.map(d=>({...d,cards:[...d.cards]}));
  if(!DECKS.some(d=>d.id===selectedDeckId))selectedDeckId=DECKS[0].id;
}
function cardFromKey(key){
  const [kind,value]=key.split(':');
  if(kind==='c'){
    const row=ROSTER.find(r=>r[0]===value);
    return row?mkC(row):null;
  }
  if(kind==='e'&&TYPES.includes(value))return{k:'e',type:value};
  if(kind==='t'){
    const i=TR.findIndex(t=>t[0]===value);
    return i<0?null:mkT(i);
  }
  return null;
}
function loadDecks(){
  selectedDeckId=localStorage.getItem(ACTIVE_DECK_STORAGE)||selectedDeckId;
  const saved=localStorage.getItem(DECK_STORAGE);
  if(!saved){useStarterDecks();return}
  let data;
  try{data=JSON.parse(saved)}catch{
    useStarterDecks();
    deckNotice='Saved deck data could not be read. Starter decks were loaded instead.';
    return;
  }
  if(!Array.isArray(data)){
    useStarterDecks();
    deckNotice='Saved deck data was invalid. Starter decks were loaded instead.';
    return;
  }
  DECKS=data.filter(d=>d&&typeof d.id==='string'&&typeof d.name==='string'&&Array.isArray(d.cards))
    .map(d=>({...d,cards:d.cards.filter(key=>CARD_KEYS.includes(key))}));
  if(!DECKS.length){
    useStarterDecks();
    deckNotice='No valid saved decks were found. Starter decks were loaded instead.';
  }
  if(!DECKS.some(d=>d.id===selectedDeckId))selectedDeckId=DECKS[0].id;
}
function saveDecks(){
  localStorage.setItem(DECK_STORAGE,JSON.stringify(DECKS));
  localStorage.setItem(ACTIVE_DECK_STORAGE,selectedDeckId);
}
function selectedDeck(){return DECKS.find(d=>d.id===selectedDeckId)}
function deckCounts(deck){
  return deck.cards.reduce((counts,key)=>(counts[key]=(counts[key]||0)+1,counts),{});
}
function deckCanStart(deck){
  return deck.cards.length>0&&deck.cards.length<=DECK_LIMIT&&deck.cards.some(key=>{
    const c=cardFromKey(key);return c&&c.k==='c'&&c.stage===0;
  });
}
const DK={ember:'#d9461b',tide:'#1c7cc0',leaf:'#3f8f2b'},BG={ember:'#ffe3d3',tide:'#d6edfb',leaf:'#e2f3d3'};
const SH={ember:'M0-12C6-4 10 0 6 8C3 12-3 12-6 8C-10 0-2-4 0-12Z',tide:'M0-12C8 0 8 4 8 6A8 8 0 0 1-8 6C-8 4-8 0 0-12Z',leaf:'M-10 8C-10-8 2-12 10-12C10 0 6 10-10 8Z'};
const mo=(t,x,y,k)=>`<path d="${SH[t]}" fill="${DK[t]}" transform="translate(${x} ${y}) scale(${k})"/>`;
const TA={
 potion:'<rect x="44" y="12" width="12" height="9" fill="#6b4a2f"/><path d="M42 23h16l8 22q2 9-6 9H40q-8 0-6-9z" fill="#b34fd1" stroke="#14202a" stroke-width="2"/>',
 draw:'<rect x="28" y="12" width="26" height="36" rx="3" fill="#fff" stroke="#14202a" stroke-width="2" transform="rotate(-10 41 30)"/><rect x="46" y="12" width="26" height="36" rx="3" fill="#fff" stroke="#14202a" stroke-width="2" transform="rotate(10 59 30)"/>',
 swap:'<path d="M24 22h44l-9-9M76 40H32l9 9" fill="none" stroke="#14202a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>',
 boost:'<polygon points="50,6 57,24 76,24 61,35 67,54 50,43 33,54 39,35 24,24 43,24" fill="#e3b341" stroke="#14202a" stroke-width="2"/>'};
// Card art is drawn in code as inline SVG, so there are no image files to host.
function art(c){
  let g;
  if(c.k==='e')g=mo(c.type,50,31,2.1);
  else if(c.k==='t')g=TA[c.fx];
  else{
    const s=c.max>=90?1.2:c.max<=50?.85:1,t=c.type,col=DK[t],i=ROSTER.findIndex(r=>r[0]===c.name);
    const ears=t==='ember'?`<polygon points="38,22 35,8 47,17" fill="${col}"/><polygon points="62,22 65,8 53,17" fill="${col}"/>`
      :t==='tide'?`<ellipse cx="35" cy="28" rx="5" ry="9" fill="${col}" opacity=".7"/><ellipse cx="65" cy="28" rx="5" ry="9" fill="${col}" opacity=".7"/>`
      :`<path d="${SH.leaf}" fill="${col}" transform="translate(40 15) scale(.9)"/><path d="${SH.leaf}" fill="${col}" transform="translate(60 15) scale(-.9 .9)"/>`;
    g=`<g style="filter:hue-rotate(${i*13%30-15}deg)"><ellipse cx="50" cy="58" rx="${24*s}" ry="2" fill="#0002"/>`+
      mo(t,80,40,1.3)+
      `<ellipse cx="50" cy="42" rx="${20*s}" ry="${13*s}" fill="${col}"/><ellipse cx="50" cy="45" rx="${11*s}" ry="${8*s}" fill="#fff6"/>`+ears+
      `<circle cx="50" cy="27" r="${11*s}" fill="${col}"/>`+
      (c.max>=90?'<path d="M42 17L38 6M58 17L62 6" stroke="#14202a" stroke-width="3.5" stroke-linecap="round"/>':'')+
      `<circle cx="45" cy="26" r="3.2" fill="#fff"/><circle cx="55" cy="26" r="3.2" fill="#fff"/><circle cx="45.8" cy="26.4" r="1.6" fill="#14202a"/><circle cx="55.8" cy="26.4" r="1.6" fill="#14202a"/></g>`;
  }
  return `<svg class="art" viewBox="0 0 100 60" aria-hidden="true"><rect width="100" height="60" fill="${c.k==='t'?'#efeaf7':BG[c.type]}"/>${g}</svg>`;
}
const pw=c=>c.en.filter(e=>e.type===c.type).length; // only matching-type energy powers attacks
const cost=(a,t)=>`<span class="pip ${t}"></span>`.repeat(a[1]);
let G,screen='decks';

function mkPlayer(name,deckKeys=null){
  const p={name,bench:[],taken:0,active:null,turns:0,gxUsed:false};
  do{
    if(deckKeys)p.deck=deckKeys.map(cardFromKey).filter(Boolean);
    else{
      p.deck=[];
      const ts=shuffle([...TYPES]).slice(0,2),pool=ROSTER.filter(r=>ts.includes(r[1]));
      for(let i=0;i<28;i++)p.deck.push(mkC(pool[i%pool.length]));
      for(let i=0;i<20;i++)p.deck.push({k:'e',type:ts[i%2]});
      for(let i=0;i<12;i++)p.deck.push(mkT(i));
    }
    shuffle(p.deck);
    p.hand=p.deck.splice(0,5);
  }while(!p.hand.some(c=>c.k==='c'&&c.stage===0)); // mulligan until a basic creature is in hand
  p.active=p.hand.splice(p.hand.findIndex(c=>c.k==='c'&&c.stage===0),1)[0];
  return p;
}
function startMatch(){
  const deck=selectedDeck();
  if(!deckCanStart(deck)){deckNotice='A playable deck needs at least one card, no more than 60 cards, and at least one Basic creature.';render();return}
  screen='game';
  G={p:mkPlayer('You',deck.cards),o:mkPlayer('Rival'),turn:'p',attached:false,retreated:false,trainerUsed:false,boost:0,sel:null,promote:false,over:null,msg:'',log:[`A new duel begins with ${deck.name}.`]};
  startTurn('p');
}
function showDeckManager(){screen='decks';render()}
const L=s=>{G.log.push(s);if(G.log.length>6)G.log.shift()};
const other=w=>w==='p'?'o':'p';

function startTurn(w){
  const P=G[w];
  if(!P.deck.length){L(`${P.name} can't draw.`);return win(other(w))}
  P.turns++;
  P.hand.push(P.deck.pop());
  G.turn=w;G.attached=G.retreated=false;G.trainerUsed=false;G.boost=0;G.sel=null;G.abilityTarget=false;G.msg='';
  G.promote=w==='p'&&!P.active;
  if(G.promote)G.msg='Your creature fainted. Pick a replacement from your bench.';
  render();
  if(w==='o')setTimeout(aiTurn,800);
}
function endTurn(){startTurn(other(G.turn))}
function win(w){G.over=w;render()}

function attack(w,i){
  const A=G[w],D=G[other(w)],a=A.active.atks[i];
  if(pw(A.active)<a[1]||(a[3]==='gx'&&A.gxUsed))return;
  const sup=BEATS[A.active.type]===D.active.type;
  const raw=(a[2]+G.boost)*(sup?2:1),dmg=Math.max(0,raw-D.active.shield);
  D.active.shield=0;
  if(a[3]==='gx')A.gxUsed=true;
  D.active.hp-=dmg;
  L(`${A.name==='You'?'Your':'Rival\u2019s'} ${A.active.name} uses ${a[0]} for ${dmg}${sup?' (super effective!)':''}.`);
  if(D.active.hp<=0){
    L(`${D.active.name} faints. ${A.name} take${A.name==='You'?'':'s'} ${D.active.prizes} prize${D.active.prizes===1?'':'s'}.`);
    A.taken+=D.active.prizes;
    D.active=null;
    if(A.taken>=PRIZES||!D.bench.length)return win(w);
    if(D===G.o)D.active=D.bench.splice(D.bench.reduce((m,c,j)=>c.hp>D.bench[m].hp?j:m,0),1)[0];
  }
  endTurn();
}

function applyEvolution(P,where,i,c){
  const old=where==='active'?P.active:P.bench[i];
  if(c.stage!==old.stage+1||c.evolvesFrom!==old.name){
    G.msg=`${c.name} can only evolve from ${c.evolvesFrom}.`;return null;
  }
  if(P.turns<=1||old.playedTurn===P.turns){
    G.msg='A creature cannot evolve on your first turn or the turn it entered play.';return null;
  }
  c.en=old.en;c.shield=old.shield;c.hp=c.max-(old.max-old.hp);c.playedTurn=P.turns;
  if(where==='active')P.active=c;else P.bench[i]=c;
  L(`${P.name==='You'?'Your':'Rival\u2019s'} ${old.name} evolves into ${c.name}.`);
  return c.rule==='MEGA EX';
}

function useAbility(P,source,target=source){
  const ability=source.ability;
  if(ability.fx==='draw'){
    if(P.deck.length)P.hand.push(P.deck.pop());
  }else if(ability.fx==='heal'){
    target.hp=Math.min(target.max,target.hp+20);
  }else if(ability.fx==='guard'){
    source.shield+=20;
  }
  source.abilityTurn=P.turns;
  L(`${P.name==='You'?'Your':'Rival\u2019s'} ${source.name} uses ${ability.name}.`);
}

function activateAbility(){
  const source=G.p.active,ability=source.ability;
  if(!myTurn()||!ability||source.abilityTurn===G.p.turns)return;
  if(ability.fx==='heal'){
    G.abilityTarget=true;G.msg='Choose one of your creatures to heal 20 HP.';
  }else{
    useAbility(G.p,source);G.msg='';
  }
  render();
}

function aiTurn(){
  if(G.over)return;
  const O=G.o;
  while(O.bench.length<3){
    const i=O.hand.findIndex(c=>c.k==='c'&&c.stage===0);if(i<0)break;
    const c=O.hand.splice(i,1)[0];c.playedTurn=O.turns;O.bench.push(c);L(`Rival benches ${c.name}.`);
  }
  if(O.turns>1){
    const i=O.hand.findIndex(c=>c.k==='c'&&c.stage>0&&[O.active,...O.bench].some(t=>t&&t.name===c.evolvesFrom&&t.playedTurn<O.turns));
    if(i>=0){
      const c=O.hand.splice(i,1)[0],targets=[O.active,...O.bench],where=targets.findIndex(t=>t&&t.name===c.evolvesFrom&&t.playedTurn<O.turns);
      const mega=applyEvolution(O,where===0?'active':'bench',where===0?0:where-1,c);
      if(mega){L('Mega Evolution ends the turn.');return endTurn()}
    }
  }
  if(O.active.ability&&O.active.abilityTurn!==O.turns){
    const ability=O.active.ability;
    if(ability.fx==='draw'&&O.deck.length)useAbility(O,O.active);
    else if(ability.fx==='heal'){
      const targets=[O.active,...O.bench].filter(Boolean).sort((a,b)=>(b.max-b.hp)-(a.max-a.hp));
      if(targets[0]&&targets[0].max-targets[0].hp>=20)useAbility(O,O.active,targets[0]);
    }else if(ability.fx==='guard')useAbility(O,O.active);
  }
  const e=O.hand.findIndex(c=>c.k==='e'&&c.type===O.active.type);
  const e2=e>=0?e:O.hand.findIndex(c=>c.k==='e'&&O.bench.some(b=>b.type===c.type));
  if(e2>=0){
    const c=O.hand.splice(e2,1)[0],t=e>=0?O.active:O.bench.find(b=>b.type===c.type);
    t.en.push(c);L(`Rival powers up ${t.name}.`);
  }
  const opts=O.active.atks.map((a,i)=>[a,i]).filter(([a])=>a[1]<=pw(O.active)&&(a[3]!=='gx'||!O.gxUsed)).sort((x,y)=>y[0][2]-x[0][2]);
  const tr=O.hand.findIndex(c=>c.k==='t'&&(c.fx==='draw'||(c.fx==='boost'&&opts.length)||(c.fx==='potion'&&O.active.hp<=O.active.max-30)));
  if(tr>=0){
    const c=O.hand.splice(tr,1)[0];
    if(c.fx==='potion')O.active.hp=Math.min(O.active.max,O.active.hp+30);else useT(O,c);
    L(`Rival plays ${c.name}.`);
  }
  if(opts.length)attack('o',opts[0][1]);
  else{L('Rival ends its turn.');endTurn()}
}

function useT(P,c){
  if(c.fx==='draw')for(let i=0;i<2&&P.deck.length;i++)P.hand.push(P.deck.pop());
  if(c.fx==='boost')G.boost=20;
}
// ---- player actions ----
const myTurn=()=>G.turn==='p'&&!G.over&&!G.promote;
function handClick(i){
  if(!myTurn()||G.abilityTarget)return;
  const P=G.p,c=P.hand[i];
  if(c.k==='c'){
    if(c.stage){
      G.sel=G.sel===i?null:i;
      G.msg=G.sel==null?'':`Choose a creature to evolve into ${c.name}.`;
    }else if(P.bench.length>=3)G.msg='Your bench is full (3 max).';
    else{G.sel=null;c.playedTurn=P.turns;P.bench.push(P.hand.splice(i,1)[0]);G.msg=''}
  }else if(c.k==='e'&&G.attached)G.msg='Only one energy per turn.';
  else if(c.k==='t'&&G.trainerUsed)G.msg='Only one trainer per turn.';
  else if(c.k==='e'||c.fx==='potion'||c.fx==='swap'){
    G.sel=G.sel===i?null:i;
    G.msg=G.sel==null?'':c.fx==='swap'?'Choose a bench creature to swap in.':c.fx==='potion'?'Choose a creature to heal.':'Choose a creature to power up.';
  }else{G.sel=null;P.hand.splice(i,1);useT(P,c);G.trainerUsed=true;G.msg='';L(`You play ${c.name}.`)}
  render();
}
function creatureClick(where,i){
  const P=G.p;
  if(G.promote){
    if(where==='bench'){P.active=P.bench.splice(i,1)[0];G.promote=false;G.msg=''}
  }else if(myTurn()){
    const t=where==='active'?P.active:P.bench[i];
    if(G.abilityTarget){
      if(t.hp===t.max){G.msg='Choose a creature with missing HP.';render();return}
      useAbility(P,G.p.active,t);G.abilityTarget=false;G.msg='';
    }else if(G.sel!=null){
      const c=P.hand[G.sel];
      if(c.k==='c'&&c.stage){
        const mega=applyEvolution(P,where,i,c);
        if(mega===null){render();return}
        P.hand.splice(G.sel,1);G.sel=null;G.msg='';
        if(mega){L('Mega Evolution ends your turn.');endTurn();return}
      }else if(c.k==='e'){t.en.push(c);G.attached=true}
      else if(c.fx==='potion'){t.hp=Math.min(t.max,t.hp+30);G.trainerUsed=true;L(`You heal ${t.name}.`)}
      else if(where==='bench'){[P.active,P.bench[i]]=[P.bench[i],P.active];G.trainerUsed=true;L(`You swap in ${P.active.name}.`)}
      else{G.msg='Pick a bench creature.';render();return}
      P.hand.splice(G.sel,1);G.sel=null;G.msg='';
    }else if(where==='bench'){
      if(G.retreated)G.msg='You already switched this turn.';
      else if(!P.active.en.length)G.msg='Switching costs 1 energy, and your active creature has none.';
      else{P.active.en.pop();[P.active,P.bench[i]]=[P.bench[i],P.active];G.retreated=true;G.msg='Switched (1 energy discarded).'}
    }
  }
  render();
}

// ---- rendering ----
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
function cardEl(c,fn,sel){
  const b=el('button','card '+c.type+(sel?' sel':''));
  if(c.k==='e')b.innerHTML=`${art(c)}<b>${c.type} energy</b>`;
  else if(c.k==='t')b.innerHTML=`${art(c)}<b>${c.name}</b><small>${c.text}</small>`;
  else b.innerHTML=`${art(c)}<b>${c.name}</b><small>${c.rule?c.rule+' \u00b7 ':''}${c.stage?`Stage ${c.stage} \u00b7 `:'Basic \u00b7 '}${c.type} \u00b7 HP ${c.hp}/${c.max}</small>`+
    `<i class="bar"><u style="width:${100*c.hp/c.max}%"></u></i>`+
    `<span class="pips">${c.en.map(e=>`<span class="pip ${e.type}"></span>`).join('')}</span>`+
    c.atks.map(a=>`<small>${a[0]}${a[3]==='gx'?' GX':''} ${cost(a,c.type)} ${c===G.p.active&&G.boost?`${a[2]} + ${G.boost} = ${a[2]+G.boost}`:a[2]}</small>`).join('')+
    (c.ability?`<small><b>Ability: ${c.ability.name}</b> ${c.ability.text}</small>`:'');
  if(fn)b.onclick=fn;else b.tabIndex=-1;
  return b;
}
function changeDeck(id){
  selectedDeckId=id;deckNotice='';saveDecks();render();
}
function addCardToDeck(key){
  const deck=selectedDeck(),copiesInDeck=deckCounts(deck)[key]||0;
  if(deck.cards.length>=DECK_LIMIT){deckNotice='Decks can contain no more than 60 cards, including Energy and Trainers.';render();return}
  if(key.startsWith('c:')&&copiesInDeck>=4){deckNotice='A deck can contain up to 4 copies of each creature.';render();return}
  deck.cards.push(key);deckNotice='';saveDecks();render();
}
function removeCardFromDeck(key){
  const deck=selectedDeck(),i=deck.cards.lastIndexOf(key);
  if(i>=0)deck.cards.splice(i,1);
  deckNotice='';saveDecks();render();
}
function createDeck(){
  const id=`deck-${Date.now()}`;
  DECKS.push({id,name:'My Deck',cards:[]});selectedDeckId=id;deckNotice='New deck created. Add cards to play (maximum 60).';saveDecks();render();
}
function renameDeck(name){
  const trimmed=name.trim();
  if(!trimmed){deckNotice='Deck names cannot be empty.';render();return}
  selectedDeck().name=trimmed;deckNotice='Deck renamed.';saveDecks();render();
}
function deleteDeck(){
  if(DECKS.length===1){deckNotice='Keep at least one deck.';render();return}
  DECKS=DECKS.filter(d=>d.id!==selectedDeckId);selectedDeckId=DECKS[0].id;deckNotice='Deck deleted.';saveDecks();render();
}
function renderDeckManager(){
  const previousPool=document.getElementById('pool-cards');
  if(previousPool)poolScrollTop=previousPool.scrollTop;
  const pageScrollX=window.scrollX,pageScrollY=window.scrollY;
  if(document.activeElement instanceof HTMLElement)document.activeElement.blur();
  const B=document.getElementById('board'),deck=selectedDeck(),counts=deckCounts(deck);
  B.innerHTML='';
  const manager=el('div','manager'),nav=el('aside','decknav'),editor=el('section','deckeditor');
  nav.append(el('h2',null,'Your decks'));
  DECKS.forEach(d=>{
    const b=el('button','btn deckitem'+(d.id===selectedDeckId?' active':''));
    b.textContent=`${d.name} (${d.cards.length}/${DECK_LIMIT})`;b.onclick=()=>changeDeck(d.id);nav.append(b);
  });
  const create=el('button','btn','New deck');create.onclick=createDeck;nav.append(create);
  const top=el('div','decktitle'),title=el('h2');title.textContent='Edit deck';top.append(title);
  const actions=el('div','deckactions');
  const name=el('input','select');name.type='text';name.maxLength=30;name.value=deck.name;name.setAttribute('aria-label','Deck name');
  const rename=el('button','btn','Rename');rename.onclick=()=>renameDeck(name.value);
  const remove=el('button','btn','Delete deck');remove.disabled=DECKS.length===1;remove.onclick=deleteDeck;
  actions.append(name,rename,remove);top.append(actions);
  const counter=el('div','info',`${deck.cards.length}/${DECK_LIMIT} cards. Creature, Trainer, and Energy cards all count toward the 60-card maximum.`);
  const start=el('button','btn go','Start match');start.disabled=!deckCanStart(deck);start.onclick=startMatch;
  const hint=el('div','deckhint',deckNotice||(!deckCanStart(deck)?'A playable deck needs at least one card, no more than 60 cards, and at least one Basic creature.':'Ready to play.'));
  const cards=el('div','deckcards');
  if(!deck.cards.length)cards.append(el('div','info','This deck is empty. Add cards from the pool.'));
  Object.entries(counts).forEach(([key,count])=>{
    const c=cardFromKey(key),entry=el('div','deckentry'),label=el('span');
    label.innerHTML=`<b>${c.name}${c.k==='e'?' Energy':''}</b><small>${c.k==='c'?`${c.stage?'Stage '+c.stage:'Basic'} · ${c.type} · ${c.max} HP`:c.k==='e'?'Energy':c.text}</small>`;
    const removeOne=el('button','btn','−');removeOne.setAttribute('aria-label',`Remove one ${c.name}`);removeOne.onclick=()=>removeCardFromDeck(key);
    const amount=el('span',null,String(count));entry.append(label,amount,removeOne);cards.append(entry);
  });
  const pool=el('section','pool'),poolTitle=el('h3',null,'Card pool'),filter=el('select','select');
  [['all','All cards'],['ember','Ember'],['tide','Tide'],['leaf','Leaf']].forEach(([value,label])=>{
    const option=document.createElement('option');option.value=value;option.textContent=label;filter.append(option);
  });
  filter.value=deckFilter;filter.setAttribute('aria-label','Filter card pool by type');filter.onchange=()=>{deckFilter=filter.value;render()};
  const poolCards=el('div','poolcards');poolCards.id='pool-cards';
  poolCards.onscroll=()=>{poolScrollTop=poolCards.scrollTop};
  CARD_KEYS.filter(key=>{
    const c=cardFromKey(key);return deckFilter==='all'||c.k==='t'||c.type===deckFilter;
  }).forEach(key=>{
    const c=cardFromKey(key),entry=el('div','poolentry'),label=el('span'),amount=counts[key]||0;
    label.innerHTML=`<b>${c.name}${c.k==='e'?' Energy':''}</b><small>${c.k==='c'?`${c.stage?'Stage '+c.stage:'Basic'} · ${c.type} · ${c.max} HP`:c.k==='e'?'Energy':c.text}</small>`;
    const add=el('button','btn','+');add.setAttribute('aria-label',`Add ${c.name} to deck`);
    add.disabled=deck.cards.length>=DECK_LIMIT||(key.startsWith('c:')&&amount>=4);
    add.onclick=()=>addCardToDeck(key);entry.append(label,el('span',null,amount?`×${amount}`:''),add);poolCards.append(entry);
  });
  pool.append(poolTitle,filter,poolCards);
  const listing=el('section');listing.append(top,counter,hint,start,cards);
  editor.append(listing,pool);manager.append(nav,editor);B.append(manager);
  poolCards.scrollTop=poolScrollTop;
  requestAnimationFrame(()=>window.scrollTo(pageScrollX,pageScrollY));
  document.getElementById('status').textContent='Build your deck';
}
function side(P,mine){
  const s=el('section','side');
  s.append(el('div','info',`${P.name}: prizes <span class=\"prizes\">${Array.from({length:PRIZES},(_,i)=>`<i class=\"prize${i<P.taken?' got':''}\"></i>`).join('')}</span> \u00b7 deck ${P.deck.length} \u00b7 hand ${P.hand.length}`));
  const act=el('div','row'),ben=el('div','row');
  act.append(P.active?cardEl(P.active,mine?()=>creatureClick('active'):null):el('div','slot','No active'));
  for(let i=0;i<3;i++)ben.append(P.bench[i]?cardEl(P.bench[i],mine?()=>creatureClick('bench',i):null):el('div','slot','Bench'));
  if(mine){s.append(act,ben);
    const h=el('div','row');
    P.hand.forEach((c,i)=>h.append(cardEl(c,()=>handClick(i),G.sel===i)));
    s.append(el('div','info','Your hand'),h);
  }else s.append(ben,act);
  return s;
}
function mid(){
  const m=el('section','mid');
  const ul=el('ul','log');G.log.forEach(t=>ul.append(el('li',null,t)));
  m.append(ul,el('div','hint',G.msg));
  const c=el('div','ctl');
  if(G.over){
    const b=el('button','btn go',G.over==='p'?'You win! Back to decks':'Rival wins. Back to decks');
    b.onclick=showDeckManager;c.append(b);
  }else if(myTurn()){
    const ability=G.p.active.ability;
    if(ability){
      const ab=el('button','btn',`Ability: ${ability.name}`);
      ab.disabled=G.p.active.abilityTurn===G.p.turns;ab.title=ability.text;ab.onclick=activateAbility;c.append(ab);
    }
    G.p.active.atks.forEach((a,i)=>{
      const power=G.boost?`${a[2]} + ${G.boost} = ${a[2]+G.boost}`:a[2];
      const b=el('button','btn',`${a[0]}${a[3]==='gx'?' GX':''} ${cost(a,G.p.active.type)} ${power}`);
      b.disabled=pw(G.p.active)<a[1]||(a[3]==='gx'&&G.p.gxUsed);b.title=`Needs ${a[1]} ${G.p.active.type} energy${a[3]==='gx'?' · once per game':''}`;b.onclick=()=>attack('p',i);c.append(b);
    });
    const e=el('button','btn go','End turn');e.onclick=()=>{L('You end your turn.');endTurn()};c.append(e);
  }
  m.append(c);
  return m;
}
function render(){
  const menu=document.getElementById('deck-menu');
  menu.hidden=screen!=='game';menu.onclick=showDeckManager;
  if(screen==='decks'){renderDeckManager();return}
  const B=document.getElementById('board');B.innerHTML='';
  B.append(side(G.o,false),mid(),side(G.p,true));
  document.getElementById('status').textContent=G.over?(G.over==='p'?'You win!':'Rival wins'):G.turn==='p'?'Your turn':'Rival is thinking\u2026';
}
loadDecks();
render();
</script>
